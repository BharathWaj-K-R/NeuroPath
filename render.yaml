services:
  - type: web
    name: neuropath-backend
    env: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && uvicorn app:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        scope: run
        value: ""
      - key: JWT_SECRET_KEY
        scope: run
        value: ""
      - key: GROK_API_KEY
        scope: run
        value: ""
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
